<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/images/logo1.png">
<title>Dolly Chiloane — Pormat Property Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:        #8C2F26;
    --red-deep:   #6E241D;
    --charcoal:   #4A3D35;
    --black:      #16130F;
    --paper:      #FAF7F2;
    --paper-dim:  #F0EAE1;
    --grey:       #7A7168;
    --line:       #E4DCCF;
    --white:      #FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:#3A2E27;
    color:var(--black);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:380px;
    background:var(--paper);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  }
  .card-top{
    background:linear-gradient(160deg, #4A3D35, #16130F);
    padding:36px 28px 76px;
    text-align:center;
    position:relative;
  }
  .card-top img.logo{
    height:28px;width:auto;margin:0 auto 20px;display:block;
    filter:brightness(0) invert(1);
    opacity:0.85;
  }
  .avatar{
    width:104px;height:104px;border-radius:50%;
    background:var(--red);
    color:var(--white);
    font-family:'Space Grotesk',sans-serif;
    font-size:2.2rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto;
    border:4px solid var(--paper);
    position:absolute;
    left:50%;bottom:-52px;transform:translateX(-50%);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .card-body{
    padding:68px 28px 32px;
    text-align:center;
  }
  .name{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;}
  .title{font-size:0.9rem;color:var(--red);font-weight:600;margin-top:4px;}
  .company{font-size:0.82rem;color:var(--grey);margin-top:2px;}

  .actions{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    margin:26px 0 22px;
  }
  .action-btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:var(--white);border:1px solid var(--line);
    border-radius:12px;padding:14px 6px;
    font-size:0.72rem;font-weight:600;color:var(--charcoal);
    text-decoration:none;
    transition:all .15s;
  }
  .action-btn:hover{border-color:var(--red);background:var(--paper-dim);}
  .action-btn svg{width:20px;height:20px;stroke:var(--red);fill:none;stroke-width:2;}

  .save-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;background:var(--red);color:var(--white);
    border:none;border-radius:12px;padding:15px;
    font-family:inherit;font-size:0.92rem;font-weight:700;
    cursor:pointer;transition:background .15s;
    margin-bottom:12px;
  }
  .save-btn:hover{background:var(--red-deep);}
  .save-btn svg{width:18px;height:18px;stroke:var(--white);fill:none;stroke-width:2;}

  .share-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;background:transparent;color:var(--charcoal);
    border:1px solid var(--line);border-radius:12px;padding:14px;
    font-family:inherit;font-size:0.88rem;font-weight:600;
    cursor:pointer;transition:all .15s;
  }
  .share-btn:hover{border-color:var(--charcoal);}
  .share-btn svg{width:16px;height:16px;stroke:var(--charcoal);fill:none;stroke-width:2;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--black);color:var(--paper);
    padding:12px 20px;border-radius:10px;font-size:0.85rem;font-weight:600;
    opacity:0;pointer-events:none;transition:all .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .card-footer{
    text-align:center;padding:0 28px 24px;
    font-size:0.72rem;color:var(--grey);
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-top">
    <img class="logo" src="assets/images/logo1.png" alt="Pormat Property Group">
    <div class="avatar" id="avatarInitials"><img src="assets/images/dolly-chiloane.jpg" alt="Dolly Chiloane"></div>
  </div>
  <div class="card-body">
    <div class="name" id="agentName">Dolly Chiloane</div>
    <div class="title" id="agentTitle">Property Practitioner</div>
    <div class="company" id="agentCompany">Pormat Property Group</div>

    <div class="actions">
      <a class="action-btn" id="callBtn" href="tel:+27660901485">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Call
      </a>
      <a class="action-btn" id="whatsappBtn" href="https://wa.me/27660901485" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        WhatsApp
      </a>
      <a class="action-btn" id="emailBtn" href="mailto:Dolly@pormat.co.za">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
        Email
      </a>
    </div>

    <button class="save-btn" id="saveContactBtn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Save Contact
    </button>
    <button class="share-btn" id="shareBtn">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      Share My Card
    </button>
  </div>
  <div class="card-footer">Pormat Property Group &middot; pormat.co.za</div>
</div>

<div class="toast" id="toast">Link copied to clipboard</div>

<script>
const agent = {
  name: "Dolly Chiloane",
  title: "Property Practitioner",
  company: "Pormat Property Group",
  phone: "+27660901485",
  phoneDisplay: "066 090 1485",
  email: "Dolly@pormat.co.za",
  website: "https://www.pormat.co.za"
};

function initials(name){
  return name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2);
}

document.getElementById('saveContactBtn').addEventListener('click', () => {
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${agent.name.split(" ").reverse().join(";")};;;`,
    `FN:${agent.name}`,
    `ORG:${agent.company}`,
    `TITLE:${agent.title}`,
    `TEL;TYPE=CELL:${agent.phone}`,
    `EMAIL:${agent.email}`,
    `URL:${agent.website}`,
    "END:VCARD"
  ].join("\n");
  const blob = new Blob([vcard], { type: "text/vcard" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${agent.name.replace(/\s+/g, "-")}.vcf`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('shareBtn').addEventListener('click', async () => {
  const shareData = {
    title: `${agent.name} — ${agent.company}`,
    text: `${agent.name}, ${agent.title} at ${agent.company}`,
    url: window.location.href
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch(e) {}
  } else {
    try {
      await navigator.clipboard.writeText(window.location.href);
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    } catch(e) {}
  }
});
</script>
</body>
</html>
